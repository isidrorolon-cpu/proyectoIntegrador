<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
    <title>Registro</title>
</head>
<body>
    <header class="header-principal">
        <div class="contenedor">
            <a class="logo" href="./index.html"><img src="./img/logo.png" alt="Enganche"></a>
            <form class="buscador" action="./search-results.html" method="get">
                <input type="text" name="busqueda" value="" placeholder="Search...">
                <button type="submit">Buscar</button>
                <p class="error-buscador"></p>
            </form>
            <nav class="nav-principal">
                <ul>
                    <li><a href="./index.html">Home</a></li>
                    <li class="item-login"><a href="./login.html">Ingresar</a></li>
                    <li class="item-registro"><a href="./register.html">Registrarse</a></li>
                    <li class="item-saludo"></li>
                    <li class="item-logout"><a href="./index.html" class="link-logout">Logout</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <div class="contenedor layout">
            <section class="categorias">
                <h2>Categorías</h2>
                <nav>
                    <ul class="lista-categorias">
                    </ul>
                </nav>
            </section>
            <section class="sectionLoginRegister">
                <div class="tituloLoginRegister">
                   <img class="logoLogin" src="./img/enganche_blanco.png" alt="Enganche">
                   <h4>Creá una cuenta</h4>
                </div>
                <div class="div-form">
                    <form class="form-Login-Register" action="./login.html" method="get">
                        <label>Email:</label>
                        <input class="campo-email" type="email" name="mail" value="" placeholder="Escriba su email">
                        <p class="error-email"></p>
                        <label>Contraseña:</label>
                        <input class="campo-password" type="password" name="pass" value="" placeholder="Escriba su contraseña">
                        <p class="error-password"></p>
                        <label>Repetir contraseña:</label>
                        <input class="campo-repetir" type="password" name="pass" value="" placeholder="Vuelva a escribir su contraseña">
                        <p class="error-repetir"></p>
                        <div class="divCheckbox">
                            <input class="inputCheckbox" id="terminos-y-condiciones" type="checkbox" name="terminos-y-condiciones" value="Aceptados">
                            <label class="labelCheckbox" for="terminos-y-condiciones">Acepto términos y condiciones</label>
                        </div>
                        <div class="divButton">
                            <button class="formButton" type="submit">Registrarme</button>
                        </div>
                        <div class="linkLoginRegister">
                            <span>¿Ya tenés cuenta?</span>
                            <a href="./login.html"><strong>Iniciá sesión</strong></a>
                        </div>
                    </form>
                </div>
            </section>
        </div>
    </main>
    <footer class="footer-principal">
        <div class="contenedor">
            <p>ENGANCHE | Proyecto Integrador | Tecnologia y Desarrollo Frontend</p>
            <ul>
                <li>Lucas Monti</li>
                <li>Bautista Figueiras</li>
                <li>Isidro Rolon</li>
            </ul>
        </div>
    </footer>
    <script src="./js/categorias.js"></script>
    <script src="./js/buscador.js"></script>
    <script src="./js/saludo.js"></script>
    <script src="./js/logout.js"></script>
    <script src="./js/register.js"></script>
</body>
</html>
