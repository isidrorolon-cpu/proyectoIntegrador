<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Oswald:wght@200..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
    <title>Producto</title>
</head>

<body>
    <header class="header-principal">
        <div class="contenedor">
            <a class="logo" href="./index.html"><img src="./img/logo.png" alt="Enganche"></a>
            <form class="buscador" action="./search-results.html" method="get">
                <input type="text" name="busqueda" value="" placeholder="Search...">
                <button type="submit">Buscar</button>
                <p class="error-buscador"></p>
            </form>
            <nav class="nav-principal">
                <ul>
                    <li><a href="./index.html">Home</a></li>
                    <li class="item-login"><a href="./login.html">Ingresar</a></li>
                    <li class="item-registro"><a href="./register.html">Registrarse</a></li>
                    <li class="item-saludo"></li>
                    <li class="item-logout"><a href="./index.html" class="link-logout">Logout</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <div class="contenedor layout">
            <section class="categorias">
                <h2>Categorías</h2>
                <nav>
                    <ul class="lista-categorias">
                    </ul>
                </nav>
            </section>
            <div class="contenido">
                <section class="detalle-producto">
                    <article class="producto-principal">
                        <img class="producto-imagen" src="" alt="">
                        <section class="producto-info">
                            <h2 class="producto-nombre"></h2>
                            <p class="producto-marca"></p>
                            <p class="producto-descripcion"></p>
                            <p class="precio-producto"></p>
                            <p class="producto-stock"></p>
                            <p class="producto-categoria"></p>
                            <h3>Tags</h3>
                            <ul class="tags-producto">
                            </ul>
                        </section>
                    </article>
                    <section class="reviews">
                        <h2>Comentarios</h2>
                        <div class="lista-reviews"></div>
                    </section>
                </section>
            </div>
        </div>
    </main>
    <footer class="footer-principal">
        <div class="contenedor">
            <p>ENGANCHE | Proyecto Integrador | Tecnologia y Desarrollo Frontend</p>
            <ul>
                <li>Lucas Monti</li>
                <li>Bautista Figueiras</li>
                <li>Isidro Rolon</li>
            </ul>
        </div>
    </footer>
    <script src="./js/categorias.js"></script>
    <script src="./js/buscador.js"></script>
    <script src="./js/saludo.js"></script>
    <script src="./js/logout.js"></script>
    <script src="./js/product.js"></script>
</body>

</html>
